name: Pernille Hoffmann
title: CEO, Denmark and Nordics
firm: Digital Realty
bio: Pernille Hoffmann is CEO of Digital Realty for Denmark and the Nordics, one of
  the world's largest data center operators. She explains that renewable energy is
  'not just an ask, it's a demand' from data center customers deploying in Denmark,
  and that Denmark will soon implement 24/7 power matching, requiring hourly renewable
  energy alignment beyond annual offsets.
topics:
- Sustainable data centers
- Renewable energy
- 24/7 power matching
- Nordic data centers
- Denmark digital infrastructure
episodeTitle: Denmark's Winning Formula for Sustainable Data Centers
