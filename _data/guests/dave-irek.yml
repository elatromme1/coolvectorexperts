name: "Dave Irek"
title: "Chief Operating Officer"
firm: "Duos Edge AI"
bio: "Dave Irek is Chief Operating Officer of Duos Edge AI, an edge data center provider that owns, builds, and operates modular facilities in underserved markets across the United States. He observes a dramatic surge in demand for edge compute, noting that interest has exploded in just the past nine months and now drives roughly a third of industry conversations at major events like Supercompute. Irek came from the transport industry and brings operational expertise to the company's differentiated model of retaining ownership and operations of its edge facilities."
topics:
  - "Edge compute demand growth"
  - "Modular data center infrastructure"
  - "Tier-three and rural market opportunities"
  - "Own-build-operate model for edge facilities"
episodeTitle: "Interest in edge compute 'has exploded'"
