name: Henrik Hansen
title: CEO
firm: Danish Datacenter Industrien
bio: Henrik Hansen is CEO of Danish Datacenter Industrien, the Danish data center
  industry association. He advocates for Denmark's data center sector in discussions
  about the country's winning formula for sustainable data centers, including its
  use of renewable energy, collaboration with regulators, and reputation for sustainable
  compute infrastructure.
