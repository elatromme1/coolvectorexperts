bio: "Richard Lukaj is Managing Director at Bank Street Capital, a financial advisory firm active in digital infrastructure capital markets. He is a leading voice on the evolving financing landscape for data centers, noting that credit markets have become extremely receptive to investment-grade borrowers while remaining selective about credit quality. Lukaj draws explicit parallels between today's AI investment cycle and the technology insurgencies of the 1990s, predicting a shakeout in which the strongest players will absorb less-prepared competitors."
topics:
  - "Capital markets for digital infrastructure"
  - "Credit markets and investment-grade hyperscalers"
  - "Institutional investor allocations to data centers"
  - "AI adoption cycle and market consolidation"
  - "Liquidity challenges in large-scale projects"
