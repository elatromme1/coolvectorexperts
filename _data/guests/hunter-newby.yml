bio: Hunter Newby is Founder and CEO of Newby Ventures, a firm making directed
  investments in network-neutral interconnection infrastructure including
  carrier hotels and purpose-built meet-me rooms. With 25 years of experience in
  major tier-one markets such as New York, he is now targeting more than 125
  mid-sized American cities that still lack neutral interconnection facilities
  and internet exchange points. Newby is a contrarian voice in the data center
  industry, warning of 'magical thinking' among large-scale developers while
  remaining bullish on the high-margin, recurring-revenue fundamentals of
  neutral interconnection.
topics:
  - Interconnection in tier-three cities
  - Internet exchange points in underserved markets
  - AI inference and low-latency connectivity
  - Data center market risks and power constraints
  - Neutral meet-me room infrastructure
