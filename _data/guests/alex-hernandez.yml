bio: Alex Hernandez is the Founder and CEO of PowerBridge, a company developing
  gigawatt-scale powered data center campuses across North America, with a
  particular focus on West Texas. He previously led the growth of the 960MW
  Cumulus Data campus in Pennsylvania, which was sold to Amazon Web Services in
  May 2024. Hernandez holds a deep conviction that West Texas will become the
  largest data center market globally, driven by abundant low-cost natural gas,
  available land, and strategic grid positioning.
topics:
  - West Texas power markets
  - Gigawatt-scale data center development
  - Natural gas as data center fuel source
  - Cumulus Data campus and the Pennsylvania market
