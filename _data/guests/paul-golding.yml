name: Paul Golding
title: Managing Director, Equity Research
firm: Macquarie Group
bio: Paul Golding is a Managing Director in Equity Research at Macquarie Group,
  covering digital infrastructure and technology. He joined colleague Chris
  Yonts in discussing how the cryptocurrency mining industry brought operational
  and technical innovation to the broader data center industry, and the
  implications for nuclear and alternative power generation.
topics:
  - Crypto mining innovation
  - Data center technology
  - Nuclear power
  - Energy transition
  - Infrastructure research
