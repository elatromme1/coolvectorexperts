name: Michael W. Harling
title: Executive Vice President, Director
firm: Municipal Capital Markets Group
bio: Michael W. Harling is an Executive Vice President and Director at Municipal Capital Markets Group, where he has worked as an investment banker in public finance for more than four decades. He specializes in tax-exempt lease financing and public-purpose facilities and has developed expertise in areas including correctional facilities, charter schools, waste-to-energy projects and green bonds. He previously led his own firm specializing in tax-exempt leasing of real estate and equipment for municipal borrowers.
topics:
  - Public finance
  - Municipal infrastructure
  - Tax-exempt financing
  - Infrastructure finance
  - Broadband financing
  - Public-purpose facilities
  - Green bonds
