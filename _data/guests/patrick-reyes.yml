name: Patrick Reyes
title: Principal
firm: One Search
bio: Patrick Reyes is a Principal at One Search, an executive recruiting firm
  focused on the infrastructure asset class. He says digital infrastructure
  investment roles have seen some of the most dramatic compensation increases on
  Wall Street, with managing director packages often exceeding $1.5 million in
  annual cash and carry with notional eight-figure value. Reyes notes the supply
  of capital for digital infrastructure is outpacing the supply of experienced
  talent, creating opportunities for adjacent professionals from energy, real
  estate, and industrials.
topics:
  - Executive compensation
  - Digital infrastructure talent
  - Private equity recruiting
  - Talent shortage
  - Compensation benchmarks
episodeTitle: Why Comp is Surging for Digital Infrastructure Investors and Operators
