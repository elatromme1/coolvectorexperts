name: Patrick Reyes
title: Managing Director
firm: One Search
bio: Patrick Reyes is a Managing Director at One Search, an executive search firm
  specializing in digital infrastructure. He tracks the extraordinary rise in executive
  compensation in the digital infrastructure sector, noting that managing directors
  overseeing data center firms can command over $1.5 million in annual cash compensation
  plus carried interest with notional values 'well into eight figures.'
topics:
- Executive search
- Digital infrastructure talent
- Compensation trends
- Operating partners
- Talent shortage
episodeTitle: Billions Earmarked for Data Centers is Seeking Operating Partners
episodeUrl: https://coolvector.substack.com/p/billions-earmarked-for-data-centers-9b6
episodeDate: '2024-11-21'
