name: Eric Prybutok
title: Managing Director & Head of Digital Infrastructure
firm: GI Partners
bio: Eric Prybutok leads digital infrastructure at GI Partners, the firm that created
  Digital Realty in 2004 from a portfolio of distressed data centers. He oversees
  GI Partners' $45 billion AUM digital infrastructure strategy, which focuses on edge
  infrastructure and operating businesses rather than hyperscale campuses. Prybutok
  argues digital infrastructure deserves a substantial allocation in institutional
  portfolios.
topics:
- Digital infrastructure strategy
- Edge infrastructure
- Private equity
- Data center history
- Portfolio construction
episodeTitle: GI Partners, in Digital Infrastructure Since 2001, Has Advice for Newcomers
episodeUrl: https://coolvector.substack.com/p/gi-partners-in-digital-infrastructure-d5a
episodeDate: '2025-04-14'
