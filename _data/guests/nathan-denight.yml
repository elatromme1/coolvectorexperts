name: "Nathan Denight"
title: "SVP of Marketing"
firm: "GTA Teleguam"
bio: "Nathan Denight is SVP of Marketing at GTA Teleguam, the leading telecommunications provider on Guam, offering a full suite of wireless, fiber broadband, data center, and cable landing station services. He is an advocate for Guam's strategic role as a transpacific cable hub, describing the island as ideally positioned to land, power, and route undersea cables between the United States and Southeast Asia. Denight is bullish on the exponential growth of data and the infrastructure demands it creates across the Pacific region, noting that Guam is now becoming as well known for connectivity as it is for tourism and military presence."
topics:
  - "Guam as a transpacific cable hub"
  - "Undersea cable infrastructure in the Pacific"
  - "Data center expansion on Guam"
  - "One-stop connectivity and cable landing services"
