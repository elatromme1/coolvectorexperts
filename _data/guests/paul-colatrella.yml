name: Paul Colatrella
title: Managing Director & Head of North American Debt
firm: Infranity
bio: Paul Colatrella is Managing Director and Head of North American Debt at Infranity,
  a Paris-based sustainable infrastructure lender launched with Generali. He leads
  the firm's expansion into the US market, where he is finding that North American
  investors are increasingly receptive to sustainability-linked lending criteria despite
  being historically less focused on ESG than European counterparts.
topics:
- Infrastructure debt
- Sustainable lending
- Data center financing
- North American market
- Esg investing
episodeTitle: Infranity, Sustainable Infrastructure Lender, Enters the North American
  Market
