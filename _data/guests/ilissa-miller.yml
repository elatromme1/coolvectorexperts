name: Ilissa Miller
title: Founder & CEO
firm: iMiller Public Relations
bio: Ilissa Miller is the Founder and CEO of iMiller Public Relations, a strategic communications firm focused on the global digital infrastructure industry. She has nearly three decades of experience across public relations, marketing, sales and product development, with expertise spanning data centers, telecommunications, wireless, cloud, edge computing, internet exchanges and network infrastructure. Miller is also the Editor-in-Chief of Data Center POST and TelecomNewsroom and has been active in industry organizations including NEDAS, OIX and the Nomad Futurist Foundation.
