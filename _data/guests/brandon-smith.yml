bio: Brandon Smith is VP of Global Sales and Product at ZincFive, a company
  specializing in nickel zinc battery solutions for mission-critical digital
  infrastructure. He is a leading voice on advances in battery technology,
  arguing that AI's uniquely volatile power demands have transformed batteries
  from a backup commodity into a core performance asset for data center design.
  Smith advocates for nickel zinc chemistry as a sustainable, recyclable
  alternative to lithium-ion, suited to the high-spike, high-cycle demands of AI
  compute environments.
topics:
  - Battery technology advances in data centers
  - Spikey AI compute and power demand
  - Nickel zinc vs lithium-ion chemistry
  - Data center sustainability and energy storage
  - Battery supply chains and China's market dominance
episodeTitle: "'Spikey' AI Compute Calls for More and Better Batteries"
