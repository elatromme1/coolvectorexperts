name: Doug Lane
title: Managing Director
firm: Global Compute Infrastructure
bio: Doug Lane is a Managing Director at Global Compute Infrastructure (GC Infra),
  launched in 2020 in partnership with Goldman Sachs. GC Infra pursues data center
  transactions outside of the most developed markets, including Poland, Bogota and
  Kyushu, Japan. Lane believes power asymmetry between supply-rich second-tier markets
  and demand-constrained primary hubs represents a major opportunity.
topics:
- Data center development
- Power asymmetry
- International markets
- Edge infrastructure
- Alternative data center locations
episodeTitle: Data Center Demand and Power 'Asymetry' is a Global Opportunity
