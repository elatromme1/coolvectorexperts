name: Chris Yonts
title: Analyst, Equity Research
firm: Macquarie Group
bio: Chris Yonts is an equity research analyst at Macquarie Group covering digital
  infrastructure and energy. He believes the 'real impact' of new nuclear power technologies
  won't be seen until the mid-2030s, and advocates for extending the life of existing
  nuclear plants as a more near-term solution to data center power demand.
topics:
- Nuclear power
- Data center energy
- Equity research
- Crypto mining history
- Power generation
episodeTitle: How Crypto Brought Innovation to the Data Center Industry
