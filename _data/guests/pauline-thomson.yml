bio: Pauline Thomson is Head of Data Science and a Managing Director at Ardian, a
  $176 billion AUM private investment firm. She led Ardian's first investment in a
  data center company, reflecting the firm's conviction in the AI opportunity in Europe
  through a Nordic data center platform focused on 'sustainable compute' powered by
  renewable energy.
