name: Tony Grayson
title: President & General Manager
firm: Northstar Enterprise & Defense
bio: Tony Grayson is former President of Compass Datacenters and now President & General
  Manager of Northstar Enterprise & Defense, a modular data center firm. A former
  US Navy submarine commander, he brings a mission-critical perspective to edge data
  centers and sees agentic AI as a key driver of modular data center demand. He argues
  that the real money in digital infrastructure will be made in distributed, latency-sensitive
  inference infrastructure.
topics:
- Modular data centers
- Edge computing
- Agentic AI
- Defense infrastructure
- Distributed compute
episodeTitle: The Modular Future of Data Centers is Coming to a Parking Lot Near You
