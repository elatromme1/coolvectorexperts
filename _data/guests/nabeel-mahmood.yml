bio: Nabeel Mahmood is a technologist, futurist, board member and keynote speaker with more than two decades of experience leading large-scale global technology organizations through periods of explosive growth, M&A, global expansion, business-model development and technology innovation. His expertise spans Big Data, Cloud, ERP, IoT, AI, mobility, data centers and the broader technology stack from grid to chip. He is a co-founder of Nomad Futurist and advises executives and boards across multiple industries.
