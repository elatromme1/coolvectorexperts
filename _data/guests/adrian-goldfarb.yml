name: Adrian Goldfarb
title: CFO
firm: Duos Technologies Group
bio: Adrian Goldfarb is CFO of Duos Technologies Group, the parent company of
  Duos Edge AI. He helped the company pivot from railcar inspection portals to
  commercializing edge data center 'pods' for remote and rural markets. He
  structured Duos' partnership with Fortress Investment Group to finance rapid
  edge data center deployment across the US, projecting ROI of two to four years
  per pod at roughly $1 million per unit.
topics:
  - Edge data center financing
  - Capital markets strategy
  - Infrastructure partnerships
  - Revenue model
  - Corporate finance
episodeTitle: From Schools to Cattle Ranchers, Demand for Edge Data Center
  'Pods' is Surging, Says Duos Edge AI
