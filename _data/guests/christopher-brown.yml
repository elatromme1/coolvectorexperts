name: Christopher Brown
title: Partner
firm: KPMG Ireland
bio: Christopher Brown is a Partner at KPMG in Ireland, advising on digital infrastructure
  and energy transitions. He notes that Ireland's most pressing energy challenge is
  not power generation but grid management and renewable energy storage, comparing
  Ireland's situation to Portugal and Spain where renewable generation has outpaced
  grid storage capability.
topics:
- Energy storage
- Grid management
- Renewable energy
- Irish data center market
- Digital infrastructure
episodeTitle: Ireland has ample clean power, but not enough storage
episodeUrl: https://coolvector.substack.com/p/ireland-has-ample-clean-power-but
episodeDate: '2025-07-31'
