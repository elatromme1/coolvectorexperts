name: Harold Chen
title: Director of Commercial Real Estate
firm: Fitch Ratings
bio: Harold Chen is Director of Commercial Real Estate at Fitch Ratings, specializing
  in data center REITs. He analyzed the differences between Equinix and Digital Realty
  Trust, noting that data center REITs differ from traditional REITs in their higher
  operational intensity and reliance on AI-driven demand, which creates different
  risk and valuation frameworks for institutional investors.
