name: Zahl Limbuwala
title: Operating Partner
firm: DTCP
bio: Zahl Limbuwala is Operating Partner at DTCP, a Germany-based digital infrastructure
  investment firm with €1.8 billion in AUM. He oversees the GreenScale platform, which
  builds large renewable data center campuses across Europe by working collaboratively
  with grid operators rather than simply being a grid consumer. Limbuwala sees Europe's
  tier-two markets as increasingly attractive as main hub capacity tightens.
topics:
- European data centers
- Renewable energy
- Grid collaboration
- Data center development
- Tier-two markets
episodeTitle: DTCP's GreenScale platform to build large, renewable data center campuses
  across Europe
episodeUrl: https://coolvector.substack.com/p/dtcps-greenscale-platform-to-build
episodeDate: '2025-06-11'
