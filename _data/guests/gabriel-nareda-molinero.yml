name: "Gabriel Nareda Molinero"
title: "CEO"
firm: "Nostrum Group"
bio: "Gabriel Nareda Molinero is CEO of Nostrum Group, one of Europe's largest data center development pipelines, with operations primarily in Spain. Under his leadership, Nostrum is developing over 500 megawatts of data center projects breaking ground in 2026, with a strategy centered on decentralized, sustainable facilities positioned close to renewable energy sources rather than in major city centres. He argues Spain is uniquely positioned as an AI infrastructure hub at the crossroads of continents, served by 30 submarine cables and 90% national fiber penetration."
topics:
  - "Spain as an emerging AI infrastructure hub"
  - "Decentralized data center strategy"
  - "Renewable energy and fiber penetration in Europe"
  - "Submarine cable connectivity"
  - "European AI deployment and scalability"
episodeTitle: "Spain is at a 'Crossroads of Continents'"
