name: Arnav Mitra
title: Managing Director
firm: EQT
bio: Arnav Mitra is a Managing Director at EQT, one of the world's largest digital
  infrastructure investors. In a Cool Vector panel alongside DigitalBridge and Zayo,
  Mitra articulated EQT's bullish thesis on fiber networks as a foundational layer
  of the AI era. 'Fiber is certainly just as critical to the data center ecosystem
  as power is,' he argued, pointing to the underappreciated role of connectivity
  infrastructure in supporting hyperscale compute demand. EQT has been a major backer
  of fiber and digital infrastructure platforms across multiple continents.
topics:
- Fiber network investment
- Digital infrastructure private equity
- AI infrastructure buildout
- Hyperscale connectivity
- EQT digital platform strategy
episodeTitle: "EQT, DigitalBridge and Zayo See 'Gargantuan' Upside in Fiber Networks"
episodeUrl: https://coolvector.substack.com
episodeDate: '2025-09-01'
