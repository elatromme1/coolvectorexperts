name: Phillip Koblence
title: Co-Founder
firm: NYI
bio: Phillip Koblence is a strategic executive and thought leader in the data center and network infrastructure industry. He co-founded NYI in 1996 and helped grow the company from a single data center in Lower Manhattan into a network with national and international capabilities. He later co-founded the Nomad Futurist Foundation and podcast to demystify critical infrastructure, expose younger generations to the technologies powering the digital world, and help develop the next generation of industry talent.
