name: Brian Jabeck
title: VP Business Development
firm: Bennett & Pless
bio: Brian Jabeck is VP of Business Development at Bennett & Pless, an
  engineering firm specializing in data center design and retrofit. He discussed
  the technical challenges and costs of retrofitting older data center
  facilities to accommodate modern workloads, noting that liquid-to-chip cooling
  innovations are forcing operators to modify even newly built facilities.
topics:
  - Data center engineering
  - Retrofitting
  - Cooling technology
  - Liquid cooling
  - Data center design
episodeTitle: Retrofitting Old Data Centers is Harder Than You Think
