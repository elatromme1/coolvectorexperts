bio: Jeff Eaton is a Partner at Five Point Infrastructure, a firm focused on
  digital and energy infrastructure investment. He examines how the history of
  real estate's institutional acceptance can inform the future trajectory of
  digital infrastructure as an asset class for institutional investors including
  US pension funds.
topics:
  - Infrastructure investment
  - Data center asset class
  - Institutional capital
  - Digital infrastructure
  - Real estate parallels
episodeTitle: Like Data Centers, Real Estate Once was Absent From Institutional Portfolios
