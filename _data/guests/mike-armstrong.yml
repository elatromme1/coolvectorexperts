name: Mike Armstrong
title: Managing Director
firm: GI Partners
bio: Mike Armstrong joined GI Partners in 2014 and has witnessed the dramatic rise
  in competition for digital infrastructure deals over the past decade. He notes that
  increased competition, while challenging, provides valuable pricing validation.
  Armstrong emphasizes the need to be disciplined and differentiated in a market now
  flooded with new capital and entrants.
topics:
- Digital infrastructure competition
- Private equity
- Cap rates
- Market dynamics
- Portfolio management
episodeTitle: Competition for Digital Infrastructure Deals is 'Really Positive'
episodeUrl: https://coolvector.substack.com/p/competition-for-digital-infrastructure
episodeDate: '2026-02-13'
