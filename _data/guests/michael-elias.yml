bio: Michael Elias is Director of Equity Research for Communications
  Infrastructure at TD Cowen. He gained attention for reporting on Microsoft's
  pullback from some data center projects, and continues to closely track
  hyperscaler capital expenditure decisions and their implications for data
  center operators and investors.
topics:
