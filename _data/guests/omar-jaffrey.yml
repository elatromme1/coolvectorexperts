name: Omar Jaffrey
title: Founder & Managing Partner
firm: Palistar Capital
bio: Omar Jaffrey is Founder and Managing Partner of Palistar Capital, a digital
  infrastructure private equity firm currently investing from a $1.9 billion
  fund. He brings deep expertise across wireless towers, fiber, and data
  centers, with a focus on building scale through disciplined acquisitions and
  value-add strategies. Jaffrey advocates for diversified digital infrastructure
  exposure across multiple connectivity asset types.
