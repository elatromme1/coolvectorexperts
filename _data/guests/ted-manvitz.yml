name: Ted Manvitz
title: Managing Director & Head of International Investments
firm: Grain Management
bio: Ted Manvitz leads international investments at Grain Management, a digital infrastructure-focused
  private equity firm. He oversees the firm's global expansion strategy, including
  tower assets in Germany, Southeast Asia, and emerging markets. Manvitz advocates
  for a middle-market approach in sub-50-megawatt deployments in tier-two cities as
  a more defensible international strategy.
topics:
- Digital infrastructure investing
- Wireless towers
- International markets
- Data center development
- Power procurement
episodeTitle: Grain Management is Going Global One Relationship at a Time
