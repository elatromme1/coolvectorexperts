name: Ted Manvitz
title: Managing Director and Head of International Investments
firm: Grain Management
bio: Ted Manvitz leads international investments at Grain Management, a digital
  infrastructure-only firm that has been investing in towers, fiber, data centers,
  and spectrum since 2007. In his Cool Vector conversation, Manvitz outlined Grain's
  thesis for investing in sub-50-megawatt data centers in tier-two cities across
  Western Europe and Southeast Asia — markets where he sees today's development-stage
  valuations eventually compressing as the same consolidation arc that reshaped U.S.
  and European infrastructure plays out globally. A lawyer by training who has worked
  in over a hundred countries, Manvitz argued that human relationships with regulators
  and local partners are the real moat in international digital infrastructure.
  'If you're having conversations about contractual protections, you're probably on
  your back foot,' he said.
topics:
- International digital infrastructure investing
- Grain Management strategy
- Tier-two city data centers
- Southeast Asia and Western Europe markets
- Public-private partnerships and government relations
episodeTitle: Grain Management is Going Global One Relationship at a Time
episodeUrl: https://coolvector.substack.com/p/grain-management-is-going-global
episodeDate: '2026-03-27'
