name: Phill Lawson-Shanks
title: Chief Innovation Officer
firm: Aligned Data Centers
bio: Phill Lawson-Shanks is Chief Innovation Officer at Aligned Data Centers, where he leads innovation in data center design, cooling technology, and operations. A veteran of the digital infrastructure industry, Lawson-Shanks has championed the idea that the sector is at an "iPhone moment" — an inflection point that will spawn vast new ecosystems of businesses and careers. He is a vocal advocate for demystifying the data center industry to attract talent from diverse backgrounds, including military veterans from the U.S. Navy nuclear submarine program. He also serves as an advisor to the Nomad Futurist Foundation, a nonprofit dedicated to educating young people and workers about careers in digital infrastructure.
topics:
  - Cooling innovation and next-generation thermal management
  - Data center workforce development and talent recruitment
  - Emerging markets digital infrastructure build-out
  - The "iPhone moment" for data centers and surrounding ecosystems
  - Nomad Futurist Foundation and industry education
episodeTitle: To Bolster its Workforce, Data Centers Must Demystify the Cloud
