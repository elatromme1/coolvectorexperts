name: John Day
title: Chief Commercial Officer
firm: CleanArc Data Centers
bio: John Day is Chief Commercial Officer of CleanArc Data Centers. He tracks debt
  market conditions in the digital infrastructure sector and notes that the largest
  data center projects have a significant debt financing advantage while debt markets
  have tightened for non-investment-grade tenants. Day shared insights at the 2026
  Pacific Telecommunications Council in Honolulu.
topics:
- Debt markets
- Data center financing
- Power availability
- Hyperscale development
- Construction financing
episodeTitle: Data Center Demand is Strong, Debt Markets are Selective
episodeUrl: https://coolvector.substack.com/p/data-center-demand-is-strong-debt
episodeDate: '2026-03-01'
