name: Brian Janous
title: Co-Founder
firm: Cloverleaf Infrastructure
bio: Brian Janous is Co-Founder of Cloverleaf Infrastructure and the former head of
  energy at Microsoft, where he oversaw the company's push toward renewable power
  for its massive data center portfolio. He argues that energy has become 'existential'
  to data center operators, and that the electric utility industry lacks the 'muscle
  memory' to build at the scale now demanded by digital infrastructure.
topics:
- Data center energy
- Renewable power
- Electric utility challenges
- Microsoft energy strategy
- Grid infrastructure
episodeTitle: How Energy Became 'Existential' to Data Centers
episodeUrl: https://coolvector.substack.com/p/how-energy-became-existential-to-43a
episodeDate: '2024-09-18'
