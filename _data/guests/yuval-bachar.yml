name: Yuval Bachar
title: Founder & CEO
firm: EdgeCloudLink
bio: Yuval Bachar is Founder and CEO of EdgeCloudLink, a company developing hydrogen-powered
  data center infrastructure. He is a leading voice on zero-emission data center design,
  arguing that hydrogen fuel cells can power the world's first gigawatt-scale zero-emission
  data center. Bachar was previously a distinguished engineer at Meta, where he led
  large-scale data center innovation.
topics:
- Hydrogen power
- Zero-emission data centers
- Sustainable infrastructure
- Clean energy
- Gigawatt data centers
episodeTitle: Hydrogen Will Fuel the First Zero-Emission Gigawatt Data Center
