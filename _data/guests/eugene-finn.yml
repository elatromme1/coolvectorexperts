name: Eugene Finn
title: Managing Director
firm: CAPCON
bio: Eugene Finn is the Managing Director of CAPCON, a Dublin-based engineering
  company that builds water and critical infrastructure around the world. He
  joined a Cool Vector panel examining Ireland's data center sector, where
  discussion ranged from the country's grid capacity challenges to its renewable
  energy ambitions and the political optics of data center power consumption.
  Finn brings the view of an engineering contractor deeply embedded in Ireland's
  infrastructure build-out at a pivotal moment for the industry.
topics:
  - Irish infrastructure engineering
  - Data center construction in Europe
  - Water and critical infrastructure
  - Energy and grid challenges
  - Digital infrastructure policy
episodeTitle: Constrained by Grid and Politics, Ireland Looks for a New Era of
  Data Center Growth
episodeUrl: https://coolvector.substack.com/p/irelands-successes-include-guinness
episodeDate: 2025-08-07
