name: Surajit Chatterjee
title: Managing Director & Country Head, Data Centre
firm: CapitaLand Investment (India)
bio: Surajit Chatterjee leads CapitaLand Investment's data center business in India,
  where the Singapore-based firm is developing major hyperscale campuses in Mumbai,
  Chennai, Hyderabad, and Bangalore. In his Cool Vector interview, Chatterjee explained
  why India has become strategically important for global hyperscalers — a combination
  of surging digital consumption, government policy support, and a growing pool of
  AI-ready enterprise customers. He also discussed CapitaLand's sustainability
  commitments, including its focus on renewable energy procurement and water-efficient
  cooling at Indian sites.
topics:
- India data center market
- CapitaLand investment strategy
- Hyperscaler demand in Asia
- Sustainable data center development
- Digital infrastructure in emerging markets
episodeTitle: "Data Centers in India 'Very Strategic' for Hyperscalers and Investors"
episodeUrl: https://coolvector.substack.com
episodeDate: '2025-05-01'
