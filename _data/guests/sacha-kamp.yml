name: Sacha Kamp
title: Investment Managing Director & Head of Investment Debt
firm: Infranity
bio: Sacha Kamp is Investment Managing Director and Head of Investment Debt at Infranity,
  overseeing the firm's global infrastructure debt investment strategy. She joined
  Paul Colatrella in discussing Infranity's digital infrastructure deal flow, including
  co-location data centers, fiber, and small-cell investments, and the firm's mandate
  to lend sustainably across the energy transition.
topics:
- Infrastructure debt
- Sustainable infrastructure
- Digital infrastructure lending
- Energy transition
- Fiber investment
