name: John Siegel
title: Partner
firm: Columbia Capital
bio: John Siegel is a Partner at Columbia Capital, a technology-focused venture and
  growth equity firm with deep roots in digital communications infrastructure. He
  discussed the future of fiber optic networks and their relationship to data center
  demand, arguing for a multi-year journey of infrastructure buildout driven by AI
  demand while cautioning against over-extrapolating near-term bullishness.
topics:
- Fiber optic infrastructure
- Data center demand
- Ai infrastructure
- Connectivity
- Technology investment
