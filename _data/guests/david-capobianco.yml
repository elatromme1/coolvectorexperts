name: David Capobianco
title: CEO & Managing Partner
firm: Five Point Energy
bio: David Capobianco is CEO and Managing Partner of Five Point Energy and
  Chairman of LandBridge, the West Texas land company. He pioneered the thesis
  that West Texas land is ideal for data centers due to cheap power, open space,
  and low cooling costs. Capobianco believes the best data center development
  opportunities lie in unconventional locations with abundant energy resources.
topics:
  - West Texas land
  - Data center site selection
  - Power access
  - Landbridge
  - Real estate strategy
episodeTitle: West Texas Land is Perfect for Data Centers, Says LandBridge Founder
