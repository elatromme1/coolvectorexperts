name: Jim Hughes
title: Managing Partner, Head of Energy Transition
firm: EnCap Investments
bio: Jim Hughes is Managing Partner and Head of Energy Transition at EnCap
  Investments, overseeing a $1.5 billion fund focused on power, low-carbon
  fuels, and carbon management. With 35 years in the power business, he
  describes today's market as uniquely 'strange,' driven by data center
  inelastic demand. He sees a five-to-seven-year window of premium returns in
  power investment.
topics:
  - Energy transition
  - Power markets
  - Data center power demand
  - Inelastic demand
  - Carbon management
episodeTitle: "EnCap: 'Strange' Power Market Driven by Data Center 'Inelastic Demand'"
episodeUrl: https://coolvector.substack.com/p/encap-strange-power-market-driven
episodeDate: 2025-02-03
