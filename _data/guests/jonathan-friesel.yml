name: Jonathan Friesel
title: Senior Managing Director
firm: DigitalBridge
bio: Jonathan Friesel is a Senior Managing Director at DigitalBridge, a leading
  global digital infrastructure investment firm. In a Cool Vector panel alongside
  EQT and Zayo, Friesel made the case that fiber networks represent one of the most
  compelling opportunities in digital infrastructure, arguing that connectivity is
  as essential to the AI buildout as power itself. DigitalBridge has been a prolific
  investor across data centers, cell towers, fiber, and small cells, making it one
  of the best-positioned firms to assess where the next wave of infrastructure capital
  should flow.
topics:
- Fiber network investment thesis
- Digital infrastructure private equity
- AI and connectivity infrastructure
- DigitalBridge investment strategy
- Hyperscale data center support
episodeTitle: "EQT, DigitalBridge and Zayo See 'Gargantuan' Upside in Fiber Networks"
episodeUrl: https://coolvector.substack.com
episodeDate: '2025-09-01'
