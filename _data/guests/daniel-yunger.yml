name: Daniel Yunger
title: Partner
firm: Kekst CNC
bio: Daniel Yunger is a Partner at Kekst CNC who advises public and private clients on complex and transformative situations. With a background as a transactional attorney, he brings an analytical and interdisciplinary approach to communications and strategic advisory work. His sector expertise includes healthcare, energy, infrastructure and TMT, with a focus on M&A, crisis communications, litigation and regulatory support and financial restructurings.
