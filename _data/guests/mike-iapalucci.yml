name: "Mike Iapalucci"
title: "Vice President, Fiber Intelligence"
firm: "FiberLocator"
bio: "Mike Iapalucci is Vice President at FiberLocator, where he leads the company's fiber intelligence business providing comprehensive data on carrier availability and fiber connectivity globally. His platform serves data center operators, carriers, wholesalers, and enterprises seeking to understand where fiber connectivity exists at any location in the world, and the company has recently expanded its coverage across Europe and Latin America. Iapalucci sees connectivity as a foundational requirement of AI and digital infrastructure growth, viewing the rise of LLMs as a powerful long-term driver for global fiber demand."
topics:
  - "Fiber intelligence and connectivity mapping"
  - "Global fiber data for digital infrastructure"
  - "AI and LLM connectivity requirements"
  - "Expansion of fiber data into Europe and Latin America"
