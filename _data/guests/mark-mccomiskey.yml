name: Mark McComiskey
title: Partner
firm: AVAIO Capital
bio: Mark McComiskey is a Partner at AVAIO Capital, a digital infrastructure and energy
  transition investment firm. AVAIO focuses on ground-up development in unconventional
  locations using a 'just-in-time' capital model, deploying capital incrementally
  as projects pass key milestones. McComiskey argues the best returns come from building
  infrastructure where it doesn't already exist, embracing complexity around power
  procurement and permitting.
topics:
- Data center development
- Just-in-time capital
- Greenfield development
- Unconventional markets
- Power procurement
episodeTitle: How AVAIO Builds Data Centers with 'Just-in-Time' Capital
episodeUrl: https://coolvector.substack.com/p/how-avaio-builds-data-centers-with-e2b
episodeDate: '2025-03-10'
