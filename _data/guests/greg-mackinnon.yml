name: Greg MacKinnon
title: Director of Research
firm: Pension Real Estate Association (PREA)
bio: Greg MacKinnon is Director of Research at the Pension Real Estate
  Association (PREA), tracking institutional capital flows into real estate and
  emerging asset classes. He draws parallels between the historical rise of real
  estate as an institutional asset class and the current trajectory of digital
  infrastructure, noting that pension funds often spend years studying a new
  asset class before allocating.
topics:
  - Institutional investment
  - Data center as asset class
  - Pension fund allocation
  - Real estate history
  - Digital infrastructure
episodeTitle: Like Data Centers, Real Estate Once was Absent From Institutional Portfolios
episodeUrl: https://coolvector.substack.com/p/like-data-centers-real-estate-once
episodeDate: 2025-11-10
headshot: /images/greg-mackinnon.png
